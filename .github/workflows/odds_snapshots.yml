name: Odds snapshots (EV_SHARP_CLV_V1)
on:
  schedule:
    - cron: '10 15 * * *'    # NBA + MLB morning
    - cron: '30 22 * * *'    # NBA + MLB evening (near close)
    - cron: '10 17 * * 3'    # NFL Wednesday (lock day, 7-day window)
    - cron: '45 23 * * 4'    # NFL Thursday night
    - cron: '30 16 * * 0'    # NFL Sunday early
    - cron: '45 19 * * 0'    # NFL Sunday late afternoon
    - cron: '50 23 * * 0'    # NFL Sunday night
    - cron: '50 23 * * 1'    # NFL Monday night
  workflow_dispatch:
    inputs:
      sports:
        description: 'Sports to snapshot (e.g. NFL,NBA,MLB)'
        default: 'NFL,NBA,MLB'
permissions:
  contents: write
concurrency:
  group: odds-snapshots
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Take snapshot
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          EVENT_CRON: ${{ github.event.schedule }}
          MANUAL_SPORTS: ${{ github.event.inputs.sports }}
        working-directory: odds_snapshots
        run: |
          case "$EVENT_CRON" in
            "10 15 * * *"|"30 22 * * *") python3 odds_snapshot_v1.py --sports NBA,MLB ;;
            "10 17 * * 3") python3 odds_snapshot_v1.py --sports NFL --hours 168 ;;
            "") python3 odds_snapshot_v1.py --sports "${MANUAL_SPORTS:-NFL,NBA,MLB}" ;;
            *) python3 odds_snapshot_v1.py --sports NFL ;;
          esac
      - name: Save snapshots
        if: always()
        run: |
          git config user.name "sports-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add odds_snapshots/ODDS_SNAPSHOTS_V1.sqlite3
          git diff --cached --quiet || git commit -m "Odds snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
