name: Grade NBA picks
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Grade picks
        working-directory: nba
        run: python3 nba_live_tracker_grade_results.py
      - name: Commit and push if the database changed
        run: |
          git config user.name "sports-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nba/NBA_PROSPECTIVE_TRACKER_V1.sqlite3
          git diff --cached --quiet || git commit -m "NBA automated grading run $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
