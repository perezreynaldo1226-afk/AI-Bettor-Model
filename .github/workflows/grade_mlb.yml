name: Grade MLB picks
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install certifi
      - name: Grade moneyline picks
        working-directory: mlb
        run: python3 mlb_live_tracker_grade_results.py
      - name: Grade spread picks
        working-directory: mlb
        run: python3 mlb_spread_live_tracker_grade_results_v2.py
      - name: Commit and push if the database changed
        run: |
          git config user.name "sports-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add mlb/MLB_PROSPECTIVE_TRACKER_V1.sqlite3
          git diff --cached --quiet || git commit -m "MLB automated grading run $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
