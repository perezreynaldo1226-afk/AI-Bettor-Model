name: Odds books probe (one-off)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check which books the odds plan returns
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python3 odds_books_probe.py
      - name: Save the result
        run: |
          git config user.name "sports-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add odds_probe/books_available.json
          git diff --cached --quiet || git commit -m "Odds books probe $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase -q && git push
